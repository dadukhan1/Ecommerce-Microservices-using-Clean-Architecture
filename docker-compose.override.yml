  services:
    catalogdb:
      container_name: catalogdb
      restart: always
      ports:
        - "21017:27017"
      volumes:
        - mongo_data:/data/db
    basketdb:
      container_name: basketdb
      restart: always
      ports:
       - "6379:6379"

    discountdb:
      container_name: discountdb
      environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=DiscountDb
      restart: always
      ports:
      - "5432:5432"
      volumes:
      - postgres_data:/var/lib/postgresql/
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U admin"]
        interval: 10s
        timeout: 5s
        retries: 5

    orderdb:
      container_name: orderdb
      environment:
        SA_PASSWORD: "YourStrongPassword123!"
        ACCEPT_EULA: "Y"
      restart: always
      ports:
        - "1433:1433"
      volumes:
        - orderdb-data:/var/opt/mssql
      healthcheck:
        test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'select 1'"]
        interval: 10s
        timeout: 10s
        retries: 5
  
    catalog:
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - "DatabaseSettings__ConnectionString=mongodb://catalogdb:27017"
        - "DatabaseSettings__DatabaseName=CatalogDb"
        - "DatabaseSettings__ProductCollectionName=Products"
        - "DatabaseSettings__BrandCollectionName=Brands"  
        - "DatabaseSettings__TypeCollectionName=Types"  
      depends_on:
        - catalogdb
      ports:
        - "8000:8080"
    basket:
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - "CacheSettings__ConnectionString=basketdb:6379"
      depends_on:
        - basketdb
      ports:
        - "8081:8080"
    discount:
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - "DatabaseSettings__ConnectionString=Server=discountdb;Port=5432;Database=DiscountDb;User Id=admin;Password=password"
      depends_on:
        - discountdb
      ports:
        - "8002:8080"
    ordering:
      ports:
        - "8004:8080"